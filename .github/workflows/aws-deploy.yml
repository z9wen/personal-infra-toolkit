name: Deploy AWS Demo

# Manually triggered. The job runs in the protected "aws-demo" environment,
# which is the only identity the AWS deploy role trusts (see
# aws/terraform/bootstrap/iam.tf). Add required reviewers to that environment
# to get an approval gate before anything touches AWS.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the latest code or tear the stack down
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy
  cancel-in-progress: false

env:
  TF_DIR: aws/terraform/app
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: aws-demo
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir="${TF_DIR}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        if: inputs.action == 'deploy'
        run: terraform -chdir="${TF_DIR}" plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'deploy'
        run: terraform -chdir="${TF_DIR}" apply -input=false tfplan

      - name: Canary deploy with CodeDeploy
        if: inputs.action == 'deploy'
        run: aws/scripts/deploy_lambda.sh "${TF_DIR}"

      - name: Smoke test
        if: inputs.action == 'deploy'
        run: aws/scripts/smoke_test.sh "$(terraform -chdir="${TF_DIR}" output -raw api_url)"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve
